spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Production must fail to start when the signing secret is missing.
bezkoder.app.jwtSecret=${JWT_SECRET}

# Production URLs — bắt buộc, không có fallback: thiếu biến nào ứng dụng
# sẽ không khởi động được (fail-fast).
payment.frontend-url=${FRONTEND_URL}
payment.backend-url=${BACKEND_PUBLIC_URL}
app.admin-origin=${ADMIN_FRONTEND_URL}
