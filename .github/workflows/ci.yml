name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: book
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JWT_SECRET: ci-only-secret-never-use-in-production-0123456789abcdef
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/book?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: VinaBookStore
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: VinaBookStore
        run: ./mvnw -B test

  storefront:
    name: Storefront
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bookstore-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: bookstore-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress

  admin:
    name: Admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: angular-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
