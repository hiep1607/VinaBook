<button
  class="chat-fab"
  #fabBtn
  [class.active]="open"
  (click)="toggle()"
  [attr.aria-expanded]="open"
  aria-controls="vinabook-chat-panel"
  [attr.aria-label]="open ? 'Đóng trợ lý VinaBook' : 'Mở trợ lý VinaBook'"
>
  <lucide-icon [name]="open ? 'x' : 'message-circle'" [size]="23"></lucide-icon>
</button>

<section
  id="vinabook-chat-panel"
  class="chat-panel"
  *ngIf="open"
  role="dialog"
  aria-modal="false"
  aria-labelledby="chat-title"
>
  <header class="chat-header">
    <div class="chat-brand">
      <span class="chat-avatar" aria-hidden="true">
        <lucide-icon name="book-open" [size]="19"></lucide-icon>
      </span>
      <div class="chat-id">
        <strong id="chat-title">Trợ lý VinaBook</strong>
        <small>Tư vấn từ catalog và chính sách cửa hàng</small>
      </div>
    </div>

    <div class="chat-actions">
      <button type="button" (click)="showCart()" [disabled]="commerceBusy || !!commerce?.uncertainConfirmation" aria-label="Xem giỏ trong chat" title="Giỏ hàng">
        <lucide-icon name="shopping-cart" [size]="17"></lucide-icon>
      </button>
      <button type="button" (click)="clearConversation()" [disabled]="clearing || commerceBusy || !!commerce?.uncertainConfirmation" aria-label="Xóa cuộc trò chuyện" title="Xóa cuộc trò chuyện">
        <lucide-icon name="trash-2" [size]="17"></lucide-icon>
      </button>
      <button type="button" (click)="toggle()" [disabled]="commerceBusy || !!commerce?.uncertainConfirmation" aria-label="Đóng trợ lý" title="Đóng">
        <lucide-icon name="x" [size]="19"></lucide-icon>
      </button>
    </div>
  </header>

  <div class="chat-body" #scrollBody (scroll)="onScroll()" aria-live="polite" aria-relevant="additions">
    <div
      *ngFor="let msg of messages; let isLast = last; trackBy: trackByIndex"
      class="msg-row"
      [class.from-user]="msg.from === 'user'"
    >
      <div class="assistant-mark" *ngIf="msg.from === 'bot'" aria-hidden="true">
        <lucide-icon name="book-open" [size]="15"></lucide-icon>
      </div>

      <div class="message-content">
        <div class="bubble" [class.user]="msg.from === 'user'">
          <p class="bubble-text">{{ msg.text }}<span class="stream-caret" *ngIf="msg.streaming" aria-hidden="true"></span></p>
        </div>

        <span class="answer-mode" *ngIf="msg.from === 'bot' && msg.fallback">
          Chế độ cơ bản
        </span>

        <div class="bot-products" *ngIf="msg.products?.length">
          <article class="bot-product" *ngFor="let p of msg.products">
            <span class="product-cover">
              <img [src]="p.image" [alt]="'Bìa sách ' + p.name" loading="lazy" />
            </span>
            <span class="bp-info">
              <span class="bp-name">{{ p.name }}</span>
              <span class="bp-author">{{ p.author }}</span>
              <span class="bp-price">
                {{ p.price | number:'1.0-0' }}đ
                <small *ngIf="p.discount > 0">Giảm {{ p.discount }}%</small>
              </span>
            </span>
            <span class="bp-actions">
              <button type="button" (click)="openProduct(p)">Xem sách</button>
              <button
                type="button"
                class="primary"
                *ngFor="let action of productActions(msg, p.id)"
                [disabled]="commerceBusy || (action.type === 'ADD_TO_CART' && addedProductIds.has(p.id))"
                (click)="runAction(action, msg)"
              >{{ action.type === 'ADD_TO_CART' && addedProductIds.has(p.id) ? 'Đã thêm' : action.label }}</button>
            </span>
          </article>
        </div>

        <div class="message-actions" *ngIf="genericActions(msg).length">
          <button type="button" *ngFor="let action of genericActions(msg)" (click)="runAction(action, msg)">
            {{ action.label }}
          </button>
        </div>

        <div class="answer-feedback" *ngIf="msg.from === 'bot' && msg.messageId && !msg.streaming">
          <span>{{ msg.feedback ? 'Đã ghi nhận' : 'Câu trả lời hữu ích?' }}</span>
          <button type="button" [class.selected]="msg.feedback === 'positive'" [disabled]="!!msg.feedback" (click)="sendFeedback(msg, 'positive')" aria-label="Câu trả lời hữu ích">👍</button>
          <button type="button" [class.selected]="msg.feedback === 'negative'" [disabled]="!!msg.feedback" (click)="sendFeedback(msg, 'negative')" aria-label="Câu trả lời chưa hữu ích">👎</button>
        </div>

        <div class="bot-chips" *ngIf="msg.chips?.length && isLast && !typing">
          <button type="button" class="chip" *ngFor="let c of msg.chips" (click)="send(c)">
            {{ c }}
          </button>
        </div>
      </div>
    </div>

    <div class="msg-row" *ngIf="showTypingDots" aria-label="Trợ lý đang trả lời">
      <div class="assistant-mark" aria-hidden="true">
        <lucide-icon name="book-open" [size]="15"></lucide-icon>
      </div>
      <div class="bubble typing"><span></span><span></span><span></span></div>
    </div>

    <div class="chat-error" *ngIf="errorText" role="alert">
      <span>{{ errorText }}</span>
      <button type="button" (click)="retry()">Thử lại</button>
    </div>
    <app-chat-commerce (busyChange)="commerceBusy = $event" (updated)="commerceUpdated()"
      (added)="addedProductIds.add($event)" (navigated)="open = false; commerceBusy = false"></app-chat-commerce>
    <app-order-cancellation *ngIf="cancellationOrderId" [orderId]="cancellationOrderId"
      (completed)="orderCancelled($event)" (closed)="cancellationOrderId = 0; commerceBusy = false"
      (busyChange)="commerceBusy = $event" (updated)="commerceUpdated()"></app-order-cancellation>
  </div>

  <footer class="chat-composer">
    <form class="chat-input" (ngSubmit)="send()">
      <label class="sr-only" for="chat-message">Câu hỏi cho trợ lý VinaBook</label>
      <textarea
        #chatInput
        id="chat-message"
        rows="1"
        maxlength="1000"
        placeholder="Hỏi về sách, giao hàng, thanh toán..."
        [(ngModel)]="draft"
        name="draft"
        autocomplete="off"
        (keydown)="onInputKeydown($event)"
      ></textarea>
      <button type="submit" [disabled]="!draft.trim() || typing || commerceBusy || !!commerce?.checkout || !!commerce?.uncertainConfirmation" aria-label="Gửi câu hỏi">
        <lucide-icon name="send" [size]="18"></lucide-icon>
      </button>
    </form>
    <p>Không chia sẻ mật khẩu, mã OTP hoặc thông tin thẻ.</p>
  </footer>
</section>
