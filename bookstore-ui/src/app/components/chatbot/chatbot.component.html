<button
  class="chat-fab"
  #fabBtn
  [class.active]="open"
  (click)="toggle()"
  [attr.aria-expanded]="open"
  aria-controls="vinabook-chat-panel"
  [attr.aria-label]="open ? 'Đóng trợ lý VinaBook' : 'Mở trợ lý VinaBook'"
>
  <lucide-icon [name]="open ? 'x' : 'message-circle'" [size]="23"></lucide-icon>
</button>

<section
  id="vinabook-chat-panel"
  class="chat-panel"
  *ngIf="open"
  role="dialog"
  aria-modal="false"
  aria-labelledby="chat-title"
>
  <header class="chat-header">
    <div class="chat-brand">
      <span class="chat-avatar" aria-hidden="true">
        <lucide-icon name="book-open" [size]="19"></lucide-icon>
      </span>
      <div class="chat-id">
        <strong id="chat-title">Trợ lý VinaBook</strong>
        <small>Tư vấn từ catalog và chính sách cửa hàng</small>
      </div>
    </div>

    <div class="chat-actions">
      <button type="button" (click)="clearConversation()" aria-label="Xóa cuộc trò chuyện" title="Xóa cuộc trò chuyện">
        <lucide-icon name="trash-2" [size]="17"></lucide-icon>
      </button>
      <button type="button" (click)="toggle()" aria-label="Đóng trợ lý" title="Đóng">
        <lucide-icon name="x" [size]="19"></lucide-icon>
      </button>
    </div>
  </header>

  <div class="chat-body" #scrollBody aria-live="polite" aria-relevant="additions">
    <div
      *ngFor="let msg of messages; let isLast = last; trackBy: trackByIndex"
      class="msg-row"
      [class.from-user]="msg.from === 'user'"
    >
      <div class="assistant-mark" *ngIf="msg.from === 'bot'" aria-hidden="true">
        <lucide-icon name="book-open" [size]="15"></lucide-icon>
      </div>

      <div class="message-content">
        <div class="bubble" [class.user]="msg.from === 'user'">
          <p class="bubble-text">{{ msg.text }}</p>
        </div>

        <span class="answer-mode" *ngIf="msg.from === 'bot' && msg.fallback">
          Chế độ cơ bản
        </span>

        <div class="bot-products" *ngIf="msg.products?.length">
          <button
            type="button"
            class="bot-product"
            *ngFor="let p of msg.products"
            (click)="openProduct(p)"
          >
            <span class="product-cover">
              <img [src]="p.image" [alt]="'Bìa sách ' + p.name" loading="lazy" />
            </span>
            <span class="bp-info">
              <span class="bp-name">{{ p.name }}</span>
              <span class="bp-author">{{ p.author }}</span>
              <span class="bp-price">
                {{ p.price | number:'1.0-0' }}đ
                <small *ngIf="p.discount > 0">Giảm {{ p.discount }}%</small>
              </span>
            </span>
          </button>
        </div>

        <div class="bot-payments" *ngIf="msg.payments?.length">
          <div class="bot-payment" *ngFor="let pm of msg.payments">
            <span class="pm-icon">{{ pm.icon }}</span>
            <span class="pm-info">
              <span class="pm-label">{{ pm.label }}</span>
              <span class="pm-desc">{{ pm.description }}</span>
            </span>
          </div>
        </div>

        <div class="bot-chips" *ngIf="msg.chips?.length && isLast && !typing">
          <button type="button" class="chip" *ngFor="let c of msg.chips" (click)="send(c)">
            {{ c }}
          </button>
        </div>
      </div>
    </div>

    <div class="msg-row" *ngIf="typing" aria-label="Trợ lý đang trả lời">
      <div class="assistant-mark" aria-hidden="true">
        <lucide-icon name="book-open" [size]="15"></lucide-icon>
      </div>
      <div class="bubble typing"><span></span><span></span><span></span></div>
    </div>
  </div>

  <footer class="chat-composer">
    <form class="chat-input" (ngSubmit)="send()">
      <label class="sr-only" for="chat-message">Câu hỏi cho trợ lý VinaBook</label>
      <textarea
        #chatInput
        id="chat-message"
        rows="1"
        maxlength="1000"
        placeholder="Hỏi về sách, giao hàng, thanh toán..."
        [(ngModel)]="draft"
        name="draft"
        autocomplete="off"
        (keydown)="onInputKeydown($event)"
      ></textarea>
      <button type="submit" [disabled]="!draft.trim() || typing" aria-label="Gửi câu hỏi">
        <lucide-icon name="send" [size]="18"></lucide-icon>
      </button>
    </form>
    <p>Không chia sẻ mật khẩu, mã OTP hoặc thông tin thẻ.</p>
  </footer>
</section>
