<label>Mã giảm giá (nếu có)</label><div class="entry"><input aria-label="Mã giảm giá" [ngModel]="code" (ngModelChange)="edit($event)" [ngModelOptions]="{standalone:true}" maxlength="32" [disabled]="busy||disabled" placeholder="Nhập mã ưu đãi"><button type="button" (click)="apply()" [disabled]="busy||disabled||!code.trim()">{{busy?'Đang kiểm tra...':'Áp dụng'}}</button><button type="button" *ngIf="discount" (click)="remove()" [disabled]="busy||disabled">Bỏ mã</button></div><p *ngIf="error" role="alert">{{error}}</p><p *ngIf="discount" role="status">Đã áp dụng {{code}}: giảm {{discount|number}}đ. Mình sẽ kiểm tra lại ưu đãi khi bạn xác nhận đặt hàng nhé.</p>
