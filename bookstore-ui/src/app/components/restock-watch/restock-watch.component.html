<p *ngIf="!auth.currentUser?.token">Bạn <a routerLink="/login">đăng nhập</a> để nhận thông báo khi sách có hàng nhé.</p><ng-container *ngIf="auth.currentUser?.token"><p *ngIf="busy" role="status">Đang kiểm tra...</p><p *ngIf="error" role="alert">{{error}} <button type="button" (click)="load()" [disabled]="busy">Thử lại</button></p><button type="button" *ngIf="data&&!data.inStock" (click)="toggle()" [disabled]="busy">{{data.state==='WAITING'?'Bỏ theo dõi':'Báo mình khi có hàng'}}</button><p *ngIf="data?.inStock">Sách hiện có hàng. Bạn tải lại trang sách để xem tồn kho mới nhé.</p><p *ngIf="notice" role="status">{{notice}}</p><a routerLink="/notifications">Xem thông báo của tôi</a></ng-container>
