<section class="search-page">

  <div class="container">

    <!-- PAGE HEADER -->

    <div class="page-header">

      <h1 class="display-title" appReveal="up">
        <span *ngIf="keyword">Kết quả cho "{{ keyword }}"</span>
        <span *ngIf="!keyword && activeCategory">Thể loại: {{ activeCategory }}</span>
        <span *ngIf="!keyword && !activeCategory">Tất cả sách</span>
      </h1>

      <span class="result-count" *ngIf="!loading && !loadError">
        {{ sortedProducts.length }} sản phẩm
      </span>

    </div>

    <!-- LOADING -->

    <div class="search-grid" *ngIf="loading">
      <div class="skeleton-card" *ngFor="let s of skeletonItems">
        <div class="skeleton-box skeleton-cover"></div>
        <div class="skeleton-box skeleton-line"></div>
        <div class="skeleton-box skeleton-line short"></div>
      </div>
    </div>

    <!-- ERROR -->

    <div class="load-error" *ngIf="!loading && loadError">
      <p>Không tải được dữ liệu tìm kiếm. Vui lòng kiểm tra kết nối.</p>
      <button class="retry-btn" (click)="retry()">Thử lại</button>
    </div>

    <!-- FILTER BAR -->

    <div class="filter-toolbar" *ngIf="!loading && !loadError">

      <!-- Mobile: nút mở/đóng panel bộ lọc -->
      <button
        type="button"
        class="filter-toggle"
        (click)="filterPanelOpen = !filterPanelOpen"
        [attr.aria-expanded]="filterPanelOpen"
        aria-controls="search-filter-panel"
      >
        Bộ lọc
        <span class="filter-count" *ngIf="hasActiveFilters">{{ activeFilterCount() }}</span>
        <lucide-icon name="chevron-down"></lucide-icon>
      </button>

      <!-- Sort (luôn hiện) -->
      <div class="sort-box">
        <label for="search-sort">Sắp xếp:</label>
        <select
          id="search-sort"
          [ngModel]="sortOrder"
          (ngModelChange)="setSortOrder($event)"
        >
          <option value="default">Mặc định</option>
          <option value="price-asc">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
        </select>
      </div>

    </div>

    <!-- PANEL BỘ LỌC: desktop luôn mở, mobile collapse qua nút Bộ lọc -->
    <div id="search-filter-panel" class="filter-panel" [class.open]="filterPanelOpen" *ngIf="!loading && !loadError">

      <!-- CATEGORY CHIPS -->

      <div class="chips" role="group" aria-label="Lọc theo thể loại">

        <button
          type="button"
          class="chip"
          [class.active]="activeCategory === ''"
          [attr.aria-pressed]="activeCategory === ''"
          (click)="setCategory('')"
        >
          Tất cả
        </button>

        <button
          type="button"
          class="chip"
          *ngFor="let cat of categories"
          [class.active]="activeCategory === cat"
          [attr.aria-pressed]="activeCategory === cat"
          (click)="setCategory(cat)"
        >
          {{ cat }}
        </button>

      </div>

      <!-- FILTERS DỰA TRÊN DỮ LIỆU THẬT -->
      <div class="filter-extras">
        <label class="filter-check">
          <input
            type="checkbox"
            [checked]="promoOnly"
            (change)="togglePromo()"
          />
          Đang khuyến mãi
        </label>

        <label class="filter-check">
          <input
            type="checkbox"
            [checked]="inStockOnly"
            (change)="toggleInStock()"
          />
          Còn hàng
        </label>

        <div class="price-range">
          <label for="min-price">Giá từ</label>
          <input
            id="min-price"
            name="minPrice"
            type="number"
            min="0"
            placeholder="0đ"
            [(ngModel)]="minPrice"
          />
          <label for="max-price">đến</label>
          <input
            id="max-price"
            name="maxPrice"
            type="number"
            min="0"
            placeholder="∞"
            [(ngModel)]="maxPrice"
          />
          <button
            type="button"
            class="price-apply-btn"
            (click)="applyPriceRange(minPrice, maxPrice)"
            [disabled]="priceInputsInvalid"
          >
            Áp dụng
          </button>
        </div>
      </div>

    </div>

    <!-- FILTER ĐANG ÁP DỤNG + XÓA -->
    <div class="active-filters" *ngIf="!loading && !loadError && hasActiveFilters">
      <span class="active-filters-label">Bộ lọc:</span>

      <button type="button" class="active-chip" *ngIf="activeCategory" (click)="clearFilter('category')">
        {{ activeCategory }} ✕
        <span class="sr-only">Xóa bộ lọc thể loại</span>
      </button>

      <button type="button" class="active-chip" *ngIf="promoOnly" (click)="clearFilter('promo')">
        Đang khuyến mãi ✕
        <span class="sr-only">Xóa bộ lọc khuyến mãi</span>
      </button>

      <button type="button" class="active-chip" *ngIf="inStockOnly" (click)="clearFilter('stock')">
        Còn hàng ✕
        <span class="sr-only">Xóa bộ lọc còn hàng</span>
      </button>

      <button
        type="button"
        class="active-chip"
        *ngIf="minPrice !== null || maxPrice !== null"
        (click)="clearFilter('price')"
      >
        {{ minPrice !== null || maxPrice !== null ? 'Khoảng giá' : '' }} ✕
        <span class="sr-only">Xóa bộ lọc khoảng giá</span>
      </button>

      <button type="button" class="clear-all-filters" (click)="clearAllFilters()">
        Xóa tất cả bộ lọc
      </button>
    </div>

    <!-- RESULTS GRID: chỉ render tối đa pageSize sản phẩm mỗi trang -->

    <div class="search-grid" *ngIf="!loading && !loadError && pagedProducts.length > 0">

      <app-product-card
        *ngFor="let product of pagedProducts; let i = index"
        [product]="product"
        appReveal="up"
        [revealDelay]="(i % 4) * 70"
      ></app-product-card>

    </div>

    <!-- PAGINATION -->
    <nav
      class="pagination"
      *ngIf="!loading && !loadError && totalPages > 1"
      aria-label="Phân trang kết quả tìm kiếm"
    >
      <button
        type="button"
        class="page-btn page-prev"
        (click)="goToPage(page - 1)"
        [disabled]="page <= 1"
        aria-label="Trang trước"
      >
        ‹ Trước
      </button>

      <button
        type="button"
        class="page-btn"
        *ngFor="let p of totalPagesArray()"
        (click)="goToPage(p)"
        [class.current]="p === page"
        [attr.aria-current]="p === page ? 'page' : null"
        [attr.aria-label]="'Trang ' + p"
      >
        {{ p }}
      </button>

      <button
        type="button"
        class="page-btn page-next"
        (click)="goToPage(page + 1)"
        [disabled]="page >= totalPages"
        aria-label="Trang sau"
      >
        Sau ›
      </button>
    </nav>

    <!-- EMPTY STATE -->

    <div class="empty" *ngIf="!loading && !loadError && sortedProducts.length === 0" appReveal="scale">

      <div class="empty-icon">🔍</div>

      <p class="empty-title">Không tìm thấy sản phẩm nào</p>

      <p class="empty-hint" *ngIf="keyword">
        Thử tìm với từ khóa khác hoặc bỏ bớt bộ lọc
      </p>

      <button
        type="button"
        class="reset-btn"
        *ngIf="hasActiveFilters"
        (click)="clearAllFilters()"
      >
        Xóa tất cả bộ lọc
      </button>

    </div>

  </div>

</section>
