<section class="auth-page">

  <div class="auth-box" appReveal="scale">

    <h1 class="display-title">
      Đăng nhập
    </h1>

    <p>
      Chào mừng quay trở lại 👋
    </p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
    <div class="form-group">

      <label for="login-email">Email</label>

      <input
        id="login-email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="ban@email.com"
        [(ngModel)]="email"
        required
      />

    </div>

    <div class="form-group">

      <label for="login-password">Mật khẩu</label>

      <div class="password-field">
        <input
          id="login-password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="Mật khẩu"
          [(ngModel)]="password"
          required
        />

        <button
          type="button"
          class="password-toggle"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          [attr.aria-pressed]="showPassword"
        >
          <lucide-icon [name]="showPassword ? 'eye-off' : 'eye'"></lucide-icon>
        </button>
      </div>

    </div>

    <p *ngIf="errorMessage" class="auth-error">
      {{ errorMessage }}
    </p>

    <a routerLink="/forgot-password" class="forgot-link">Quên mật khẩu?</a>

    <button
      type="submit"
      class="auth-btn"
      [disabled]="loginForm.invalid || loggingIn"
    >
      {{ loggingIn ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
    </form>

    <div class="auth-link">

      Chưa có tài khoản?

      <a routerLink="/register">
        Đăng ký
      </a>

    </div>

  </div>

</section>
